<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote Desk</title>
<meta name="theme-color" content="#0B3A6E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>

<!-- Sign in / sign up -->
<section id="auth" hidden>
  <div class="authcard">
    <div class="brand" style="color:var(--navy)"><div class="logo" style="background:var(--navy);color:#fff">B</div>Quote Desk</div>
    <div id="authBody"></div>
  </div>
</section>

<!-- App -->
<div id="app" hidden>
  <header class="top">
    <div class="brand"><div class="logo">B</div><span>Quote Desk</span><span id="demoPill" hidden></span></div>
    <nav class="nav" aria-label="Main">
      <button data-nav="today">Today</button>
      <button data-nav="inbox">Inbox<span class="badge" id="inboxBadge" hidden>0</span></button>
      <button data-nav="settings">Settings</button>
    </nav>
    <div class="hright">
      <button class="hbtn" data-act="newDeal">+ New deal</button>
      <button class="hbtn" data-act="refresh" aria-label="Refresh" title="Refresh">↻</button>
    </div>
  </header>
  <div id="shell">
    <main id="main"></main>
    <button id="handle" aria-label="Drag to resize the Claude panel"><span></span></button>
    <section id="chat" class="dock" aria-label="Ask Claude">
      <div class="chead">
        <button class="grip" id="grip" aria-label="Drag to move the window" style="display:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></button>
        <div class="cicon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg></div>
        <div style="flex:1 1 auto;min-width:0"><div style="font-weight:600">Ask Claude</div><div id="ctx" class="muted" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div></div>
        <button class="ibtn" id="toggleMode" aria-label="Pop out" title="Pop out / dock"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/></svg></button>
        <button class="ibtn" id="minBtn" aria-label="Minimise" title="Minimise"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="cfoot">
        <div class="chips" id="chips"></div>
        <form class="composer" id="composer">
          <input id="cin" type="text" aria-label="Message to Claude" placeholder="Ask Claude… (Enter to send)" autocomplete="off">
          <button class="send" type="submit" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
        </form>
      </div>
    </section>
    <button id="bubble" aria-label="Open Ask Claude"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>Ask Claude</button>
  </div>
</div>

<div id="modal"><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"><span id="ttext"></span><button id="tundo" type="button">Undo</button></div>

<script src="config.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
